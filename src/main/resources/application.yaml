activation:
  worker:
    fixed-delay: ${WORKER_DELAY}
spring:
  application:
    name: activation-service
  datasource:
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?useTimezone=true&serverTimezone=UTC
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
server:
  port: ${PORT}
  servlet:
    context-path: /api